#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - ufw

write_files:
  # docker config
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "dns": ["8.8.8.8", "8.8.4.4"],
        "userland-proxy": false
      }
    owner: root:root
    permissions: '0644'

  # floating ip generate
  - path: /usr/local/bin/configure-floating-ip.sh
    content: |
      #!/bin/bash
      FLOATING_IP="${floating_ip}"
      if ip addr show | grep -q "$FLOATING_IP"; then
        echo "Floating IP $FLOATING_IP already configured"
        exit 0
      fi
      ip addr add $FLOATING_IP/32 dev eth0 || true
      mkdir -p /etc/network/interfaces.d
      cat > /etc/network/interfaces.d/60-floating-ip.cfg <<EOF
      auto eth0:1
      iface eth0:1 inet static
        address $FLOATING_IP/32
      EOF
      echo "Floating IP $FLOATING_IP configured successfully"
    owner: root:root
    permissions: '0755'

 
 
  # if sub dokploy to inject master dokploy public key
  %{ if is_master_dokploy }
  - path: /root/.ssh/authorized_keys
    content: |
      ${master_dokploy_ssh_public_key}
    owner: root:root
    permissions: '0600'
  %{ endif }

runcmd:
  - echo "🚀 Starting Cloud Init Setup..."
  # docker install
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - rm /tmp/get-docker.sh
  - systemctl enable docker
  - systemctl start docker

  # floating ip bind 
  - bash /usr/local/bin/configure-floating-ip.sh
  - docker network create traefik
  - usermod -aG docker root

   # Dokploy install
  - curl -sSL https://dokploy.com/install.sh | bash

  # port open
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'

%{ if enable_postgres }
  - ufw allow 5432/tcp comment 'PostgreSQL'
%{ endif }
%{ if enable_mysql }
  - ufw allow 3306/tcp comment 'MySQL'
%{ endif }
%{ if enable_mongo }
  - ufw allow 27017/tcp comment 'MongoDB'
%{ endif }
%{ if enable_redis }
  - ufw allow 6379/tcp comment 'Redis'
%{ endif }

  - ufw --force enable
  - ufw status verbose

  - sleep 20
  - docker ps

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G
